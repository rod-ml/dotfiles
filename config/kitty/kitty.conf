# Sora theme (pi theme port) + transparency
include sora.conf

enabled_layouts splits:*
map cmd+enter launch --location=vsplit

# Horizontal split with cmd+shift+enter (bonus)
map cmd+shift+enter launch --location=hsplit

# Focus navigation (vim-style)
map cmd+h neighboring_window left
map cmd+j neighboring_window down
map cmd+k neighboring_window up
map cmd+l neighboring_window right

# Cycle windows
map cmd+] next_window
map cmd+[ previous_window

# Explicit close bindings
map cmd+w close_window
map cmd+shift+w close_tab

# Resize splits (repeat by holding)
map cmd+shift+h resize_window wider
map cmd+shift+l resize_window narrower
map cmd+shift+k resize_window shorter
map cmd+shift+j resize_window taller

# Move/swap split position
map cmd+ctrl+h move_window_backward
map cmd+ctrl+j move_window_forward
map cmd+ctrl+k move_window_backward
map cmd+ctrl+l move_window_forward

# Blinking cursor so the focused pane is obvious
cursor_blink_interval 0.5
cursor_blink_ease_in 0
cursor_blink_ease_out 0

# Visual focus cues
window_border_width 3pt
draw_active_borders yes
active_border_color #6a7ba2
inactive_border_color #3a4152
inactive_window_background #1a1a1a

# Padding around panes
window_padding_width 8
